<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deriv Connection Test</title><style>body{font-family:Arial,sans-serif;background:#111;color:#fff;padding:20px}h1{font-size:22px}#status{font-size:20px;margin:15px 0;padding:15px;border-radius:10px;background:#222}.ok{background:#164d2a!important}.bad{background:#5a2020!important}.box{margin-top:15px;padding:12px;background:#1c1c1c;border-radius:10px;white-space:pre-wrap;word-break:break-word}button{padding:14px 18px;border:0;border-radius:8px;font-size:16px}</style></head><body><h1>BLUEPRINT — Deriv Connection Test</h1><div id="status">Testing connection…</div><div class="box" id="log">Starting…</div><button onclick="location.reload()">Test Again</button><script>
const statusEl=document.getElementById('status'),log=document.getElementById('log');
const endpoints=['wss://api.derivws.com/trading/v1/options/ws/public','wss://ws.binaryws.com/websockets/v3'];let i=0,ws=null,timer=null;
function logit(s){log.textContent += '\n'+s}
function tryNext(){if(ws){try{ws.close()}catch(e){}} if(timer)clearTimeout(timer); if(i>=endpoints.length){statusEl.textContent='❌ WebSocket connection failed';statusEl.className='bad';logit('Both Deriv public endpoints failed to open. This indicates a browser/network WebSocket problem.');return}const ep=endpoints[i++];statusEl.textContent='Connecting to endpoint '+i+' of '+endpoints.length+'…';logit('Trying: '+ep);ws=new WebSocket(ep);timer=setTimeout(()=>{logit('No connection after 6 seconds.');tryNext()},6000);ws.onopen=()=>{clearTimeout(timer);statusEl.textContent='🟢 CONNECTED';statusEl.className='ok';logit('SUCCESS: WebSocket opened.');ws.send(JSON.stringify({active_symbols:'brief',req_id:1}));ws.send(JSON.stringify({ticks:'1HZ100V',subscribe:1,req_id:2}));};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.error){logit('Deriv API error: '+JSON.stringify(d.error));return}if(d.msg_type==='tick'){statusEl.textContent='🟢 LIVE — 1HZ100V price: '+d.tick.quote;logit('Live tick received.');}}catch(x){logit('Message received.')}};ws.onerror=()=>{logit('WebSocket error on this endpoint.');};ws.onclose=e=>{if(statusEl.textContent.indexOf('CONNECTED')<0&&statusEl.textContent.indexOf('LIVE')<0){logit('Closed: code '+e.code);tryNext()}}}
tryNext();
</script></body></html>
